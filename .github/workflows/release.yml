name: 发布 Release

# 推送 v* 标签（如 v1.0.0）时自动打包并发布 GitHub Release。
# 本仓库是 Gitee 的 GitHub 镜像仓库，Gitee 侧推 tag 并同步到 GitHub 后即可触发；
# 也可 workflow_dispatch 手动补跑（需把运行所用 ref 选到某个 v* 标签，否则各 job 条件不满足而跳过）。
#
# 产物形态：
#   桌面端（win-x64）：
#     DBSyncTool-<v>-win-x64.zip          便携版·自包含多文件（exe + dll + 原生库，整包解压后运行）
#     DBSyncTool-<v>-win-x64-fd.zip       fd 体积版（不含 .NET 运行时，需目标机已装 .NET 10 Runtime）
#     DBSyncTool-Setup-<v>-win-x64.exe    Inno Setup 安装向导（自包含）
#   CLI（x64 三平台）：
#     dbsync-<v>-<rid>[.exe]              单文件（win-x64 / linux-x64 / osx-x64）
#
# 说明：桌面便携版使用“多文件”而非“压缩单文件”——后者在部分 .NET SDK 配置下会丢失
# Avalonia 内嵌资源（The resource /Assets/app-icon.ico could not be found）导致启动即崩。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- CLI：跨平台 RID matrix（ubuntu 上 cross-publish） ----------
  build-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CLI 无图形资源、不裁剪、不启用 R2R（纯 IL + 各 RID 原生资产），单台 ubuntu 即可 cross 出全平台单文件
        rid: [win-x64, linux-x64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        run: |
          V="${GITHUB_REF_NAME#v}"
          # VERSION=完整版本（如 1.0.1-rc.1）用于产物文件名/Release；VER=纯数字前段，供 AssemblyVersion（不允许预发布段）
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VER=${V%%-*}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布 CLI(${{ matrix.rid }} 自包含单文件)
        run: >
          dotnet publish src/DBSync.CLI/DBSync.CLI.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:Version=$VER
          -o publish/cli-${{ matrix.rid }}

      - name: 移除 pdb
        run: find "publish/cli-${{ matrix.rid }}" -name '*.pdb' -delete

      - name: 校验单文件并重命名产物
        run: |
          ext=""; [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          bin="publish/cli-${{ matrix.rid }}/dbsync$ext"
          test -f "$bin"
          # 单文件断言：发布目录应只剩 dbsync[.exe]；若依赖漂移带回旁置文件，此处失败
          remaining=$(find "publish/cli-${{ matrix.rid }}" -type f -name '*.dll' -o -type f ! -name 'dbsync*' | wc -l)
          if [ "$remaining" -ne 0 ]; then echo "存在非预期旁置文件"; ls -la "publish/cli-${{ matrix.rid }}"; exit 1; fi
          mv "$bin" "publish/cli-${{ matrix.rid }}/dbsync-$VERSION-${{ matrix.rid }}$ext"
          ls -la "publish/cli-${{ matrix.rid }}"

      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: publish/cli-${{ matrix.rid }}/dbsync-*

  # ---------- 桌面端：win-x64，便携多文件 zip + fd 体积版 + Inno 安装包 ----------
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          # VERSION=完整版本（如 1.0.1-rc.1）用于产物文件名/Release；VER=纯数字前段，供 AssemblyVersion 与 Inno 内部版本（不允许预发布段）
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VER=${V%%-*}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 自包含多文件整目录（native 旁置、裁剪 partial、不压缩单文件）。
      # 同一份产物复用为“便携 zip”与“Inno 安装包”的输入；多文件形态彻底规避压缩单文件丢失 Avalonia 内嵌资源的问题。
      - name: 发布桌面版-自包含多文件(便携zip与Inno共用)
        run: >
          dotnet publish src/DBSync.Desktop/DBSync.Desktop.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishTrimmed=true -p:TrimMode=partial
          -p:DebugType=none
          -p:Version=$env:VER
          -o publish/desktop

      - name: 移除 pdb
        shell: pwsh
        run: Get-ChildItem publish/desktop -Recurse -Filter *.pdb | Remove-Item

      - name: 便携版启动冒烟（验证裁剪后资源可正常加载）
        shell: pwsh
        run: |
          $p = Start-Process 'publish/desktop/DBSync.Desktop.exe' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "便携版启动即退出 code=$($p.ExitCode)" }
          Write-Host 'PASS：冒烟运行正常'
          Stop-Process -Id $p.Id -Force

      - name: 压缩便携 zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/desktop/* -DestinationPath "DBSyncTool-$env:VERSION-win-x64.zip" -Force
          Get-ChildItem "DBSyncTool-$env:VERSION-win-x64.zip" | Select-Object Name, Length

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 编译 Inno 安装包
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe：$iscc" }
          # MyAppVersion 传纯数字 VER（Inno 的 VersionInfoVersion 同样不接受 -rc.x 段）；文件名随后统一为完整 VERSION
          & $iscc "build\setup.iss" `
            "/DMyAppVersion=$env:VER" `
            "/DDesktopDir=$env:GITHUB_WORKSPACE\publish\desktop" `
            "/DIconPath=$env:GITHUB_WORKSPACE\src\DBSync.Desktop\Assets\app-icon.ico"
          # iss 的 OutputDir 指向仓库根，产物为 DBSyncTool-Setup-<VER>-win-x64.exe；有 rc 后缀时重命名为完整版本名
          if ($env:VERSION -ne $env:VER) {
            Move-Item "DBSyncTool-Setup-$env:VER-win-x64.exe" "DBSyncTool-Setup-$env:VERSION-win-x64.exe" -Force
          }
          Get-ChildItem "DBSyncTool-Setup-$env:VERSION-win-x64.exe" | Select-Object Name, Length

      # fd 体积版（体积优先，需目标机已装 .NET 10 Runtime）。
      #     .NET 不允许裁剪非独立应用（NETSDK1102），故不裁剪；
      #     以整目录 zip 发布（内含 exe + dll + 原生库），不含 .NET 运行时所以体积最小。
      - name: 发布桌面版-fd体积版(整目录)
        run: >
          dotnet publish src/DBSync.Desktop/DBSync.Desktop.csproj -c Release -r win-x64
          --self-contained false
          -p:DebugType=none
          -p:Version=$env:VER
          -o publish/desktop-fd

      - name: 移除 fd pdb
        shell: pwsh
        run: Get-ChildItem publish/desktop-fd -Recurse -Filter *.pdb | Remove-Item

      - name: 压缩 fd 便携版为 zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/desktop-fd/* -DestinationPath "DBSyncTool-$env:VERSION-win-x64-fd.zip"
          Get-ChildItem "DBSyncTool-$env:VERSION-win-x64-fd.zip" | Select-Object Name, Length

      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          # 同时命中三个产物：便携多文件 zip、fd 体积版 zip、Inno 安装包 exe
          path: |
            DBSyncTool-*.exe
            DBSyncTool-*.zip

  # ---------- 汇总产物并创建 GitHub Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-desktop, build-cli]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待上传产物
        run: ls -la dist/

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
