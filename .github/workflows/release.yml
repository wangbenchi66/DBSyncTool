name: 发布 Release

# 推送 v* 标签（如 v1.0.0）时自动打包并发布 GitHub Release。
# 本仓库是 Gitee 的 GitHub 镜像仓库，Gitee 侧推 tag 并同步到 GitHub 后即可触发；
# 也可 workflow_dispatch 手动补跑（需把运行所用 ref 选到某个 v* 标签，否则各 job 条件不满足而跳过）。
#
# 产物形态（自 v1.1 起，不再发布“整目录 zip”）：
#   桌面端（win-x64）：
#     DBSyncTool-<v>-win-x64.exe          绿色单文件（原生库自解压，免安装，自包含）
#     DBSyncTool-<v>-win-x64-fd.zip       fd 体积版整目录（不含 .NET 运行时，需目标机已装 .NET 10）
#     DBSyncTool-Setup-<v>-win-x64.exe    Inno Setup 安装向导（自包含）
#   CLI（x64 三平台）：
#     dbsync-<v>-<rid>[.exe]              单文件（win-x64 / linux-x64 / osx-x64）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- CLI：跨平台 RID matrix（ubuntu 上 cross-publish） ----------
  build-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CLI 不裁剪、不启用 R2R（纯 IL + 各 RID 原生资产），单台 ubuntu 即可 cross 出全平台单文件
        rid: [win-x64, linux-x64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布 CLI(${{ matrix.rid }} 自包含单文件)
        run: >
          dotnet publish src/DBSync.CLI/DBSync.CLI.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -p:Version=$VERSION
          -o publish/cli-${{ matrix.rid }}

      - name: 移除 pdb
        run: find "publish/cli-${{ matrix.rid }}" -name '*.pdb' -delete

      - name: 校验单文件并重命名产物
        run: |
          ext=""; [[ "${{ matrix.rid }}" == win-* ]] && ext=".exe"
          bin="publish/cli-${{ matrix.rid }}/dbsync$ext"
          test -f "$bin"
          # 单文件断言：发布目录应只剩 dbsync[.exe]；若依赖漂移带回旁置文件，此处失败
          remaining=$(find "publish/cli-${{ matrix.rid }}" -type f -name '*.dll' -o -type f ! -name 'dbsync*' | wc -l)
          if [ "$remaining" -ne 0 ]; then echo "存在非预期旁置文件"; ls -la "publish/cli-${{ matrix.rid }}"; exit 1; fi
          mv "$bin" "publish/cli-${{ matrix.rid }}/dbsync-$VERSION-${{ matrix.rid }}$ext"
          ls -la "publish/cli-${{ matrix.rid }}"

      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: publish/cli-${{ matrix.rid }}/dbsync-*

  # ---------- 桌面端：win-x64，整目录(供 Inno) + 单文件(绿色版) 两形态 ----------
  build-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A. 安装版输入：整目录（原生库旁置，关闭单文件）。
      #    安装到 Program Files 后直接加载真实 dll，无自解压、启动快、杀软友好。
      - name: 发布桌面版-整目录(供 Inno)
        run: >
          dotnet publish src/DBSync.Desktop/DBSync.Desktop.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishTrimmed=true -p:TrimMode=partial
          -p:DebugType=none -p:InvariantGlobalization=true
          -p:Version=$env:VERSION
          -o publish/desktop-install

      # B. 绿色单 exe：单文件 + 原生库内嵌（运行时自解压到 %TEMP%\.net）。
      #    依赖瘦身已去除 Easy.* 元包，产物不再含 aspnetcorev2_inprocess.dll。
      - name: 发布桌面版-单文件(绿色版)
        run: >
          dotnet publish src/DBSync.Desktop/DBSync.Desktop.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true
          -p:PublishTrimmed=true -p:TrimMode=partial
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:InvariantGlobalization=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION
          -o publish/desktop-single

      - name: 移除 pdb
        shell: pwsh
        run: |
          Get-ChildItem publish/desktop-install -Recurse -Filter *.pdb | Remove-Item
          Get-ChildItem publish/desktop-single  -Recurse -Filter *.pdb | Remove-Item

      - name: 断言绿色版发布目录只剩 DBSync.Desktop.exe
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish/desktop-single -File)
          $files.Name
          $extra = $files | Where-Object { $_.Name -ne 'DBSync.Desktop.exe' }
          if ($extra.Count -gt 0) { throw "绿色版存在非预期旁置文件：$($extra.Name -join ', ')" }
          if (-not (Test-Path 'publish/desktop-single/DBSync.Desktop.exe')) { throw '绿色版缺失主程序' }
          Write-Host 'PASS：单文件成立'

      - name: 绿色版启动冒烟
        shell: pwsh
        run: |
          $p = Start-Process 'publish/desktop-single/DBSync.Desktop.exe' -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "绿色版启动即退出 code=$($p.ExitCode)" }
          Write-Host 'PASS：冒烟运行正常'
          Stop-Process -Id $p.Id -Force

      - name: 复制为带版本号产物名（绿色版）
        shell: pwsh
        run: |
          Copy-Item 'publish/desktop-single/DBSync.Desktop.exe' "DBSyncTool-$env:VERSION-win-x64.exe"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 编译 Inno 安装包
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe：$iscc" }
          & $iscc "build\setup.iss" `
            "/DMyAppVersion=$env:VERSION" `
            "/DDesktopDir=$env:GITHUB_WORKSPACE\publish\desktop-install" `
            "/DIconPath=$env:GITHUB_WORKSPACE\src\DBSync.Desktop\Assets\app-icon.ico"
          # iss 的 OutputDir 指向仓库根，产物为 DBSyncTool-Setup-<v>-win-x64.exe
          Get-ChildItem "DBSyncTool-Setup-$env:VERSION-win-x64.exe" | Select-Object Name, Length

      # C. fd 体积版（体积优先，需目标机已装 .NET 10 Runtime）。
      #     .NET 不允许裁剪非独立应用（NETSDK1102），故不裁剪；
      #     以整目录 zip 发布（内含 exe + dll + 原生库），压缩后体积明显小于自包含单文件。
      - name: 发布桌面版-fd体积版(整目录)
        run: >
          dotnet publish src/DBSync.Desktop/DBSync.Desktop.csproj -c Release -r win-x64
          --self-contained false
          -p:DebugType=none -p:InvariantGlobalization=true
          -p:Version=$env:VERSION
          -o publish/desktop-fd

      - name: 移除 fd pdb
        shell: pwsh
        run: Get-ChildItem publish/desktop-fd -Recurse -Filter *.pdb | Remove-Item

      - name: 压缩 fd 便携版为 zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/desktop-fd/* -DestinationPath "DBSyncTool-$env:VERSION-win-x64-fd.zip"
          Get-ChildItem "DBSyncTool-$env:VERSION-win-x64-fd.zip" | Select-Object Name, Length

      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          # 同时命中三个产物：绿色单文件、安装包、fd 体积版 zip
          path: |
            DBSyncTool-*.exe
            DBSyncTool-*.zip

  # ---------- 汇总产物并创建 GitHub Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-desktop, build-cli]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待上传产物
        run: ls -la dist/

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
